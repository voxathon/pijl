[project]
name = "pijl"
version = "0.2.1"
description = "A visual logic circuit editor and simulator"
readme = "README.md"
authors = [
    { name = "moxxie", email = "moxxie@knolastna.me" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["logic", "circuit", "simulator", "digital", "gates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "numpy>=2.5.3",
    "pyglet>=2.1.16",
    "ruff>=0.16.9",
    "scipy>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/voxathon/pijl"
Repository = "https://github.com/voxathon/pijl"
Issues = "https://github.com/voxathon/pijl/issues"

[project.scripts]
pijl = "pijl:main"

[project.gui-scripts]
pijl-gui = "pijl:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
